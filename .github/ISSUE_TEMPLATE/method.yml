name: Method improvement
description: Propose a reproducible improvement using public or synthetic information only.
title: "method: "
labels: [method]
body:
  - type: textarea
    id: objective
    attributes:
      label: Affected public behavior
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should it be validated?
    validations:
      required: true
