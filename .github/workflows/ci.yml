name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize required CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python,javascript-typescript
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser test tooling
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Refresh generated verification inputs
        run: |
          npm run manifest
          npm run facts
          npm run manifest
      - name: Run verification suite
        run: npm run check
      - name: Unit coverage summary
        run: |
          set -euo pipefail
          mkdir -p build
          node --test --experimental-test-coverage tests/*.js > build/unit-coverage.txt 2>&1 || {
            cat build/unit-coverage.txt
            exit 1
          }
          cat build/unit-coverage.txt
          {
            echo "### Unit coverage (Node tests/*.js)"
            echo ""
            echo '```'
            # Keep the coverage table from the report
            awk '/^[- ]*[-]+[- ]*$/{p=1} p{print} /^all files/{exit}' build/unit-coverage.txt | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fde-unit-coverage
          path: build/unit-coverage.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify Pages deployment portability
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          python3 scripts/build_pages.py \
            --source site \
            --output "$TMP_DIR/current"
          diff -qr site "$TMP_DIR/current"
          python3 scripts/build_pages.py \
            --source site \
            --output "$TMP_DIR/portable" \
            --public-url "https://portable.example/frontier-decision-engine/"
      - name: Run required CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: codeql-required-results
      - name: Show generated drift before failing
        run: |
          if ! git diff --quiet; then
            echo '--- generated files differ from the committed source ---'
            git diff -- project-facts.json site/src/version.js site/manifest.sha256
          fi
      - name: Verify generated files are current
        run: git diff --exit-code
