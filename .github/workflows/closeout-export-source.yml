name: FDE v0.3.4 bounded closeout

on:
  push:
    branches:
      - hardening/first-run-boundaries-v0.3.4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply and validate bounded closeout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/closeout_apply_v034.py
          npm version 0.3.4 --no-git-tag-version
          npm run facts
          npm test
          npm run validate:version
          npm run validate
          npm run manifest
          rm scripts/closeout_apply_v034.py .github/workflows/closeout-export-source.yml
          git config user.name 'Bridge Node 7'
          git config user.email '291729790+Bridge-Node-7@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release v0.3.4 — harden first-run decision boundaries'
          git push origin HEAD:hardening/first-run-boundaries-v0.3.4
