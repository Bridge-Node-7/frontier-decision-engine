name: Refresh generated closeout evidence

on:
  push:
    branches:
      - feat/governed-mission-context

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Refresh generated manifest then project facts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run manifest
          npm run facts
      - name: Commit generated state and self-remove
        run: |
          rm .github/workflows/refresh-generated-closeout.yml
          git config user.name 'Bridge Node 7'
          git config user.email '291729790+Bridge-Node-7@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh FDE 0.4.0 generated verification state'
          git push origin HEAD:feat/governed-mission-context
