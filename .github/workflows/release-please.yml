name: release-please

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/**"
      - "release-please-config.json"
      - "MANIFEST.sha256"
      - "REPO_MANIFEST.json"
      - "REPO_FILE_MANIFEST.sha256"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Publication runs through release.yml so the release is validated,
      # packaged, attested and verified before it becomes immutable.
      - name: Start packaged release for a merged version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          TAG="v${VERSION}"
          test "${VERSION}" = "$(jq -r '.version' package.json)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already published."
            exit 0
          fi
          if ! git diff --name-only "${RELEASE_COMMIT}^" "${RELEASE_COMMIT}" | grep -qx '.release-please-manifest.json'; then
            echo "No version change in ${RELEASE_COMMIT}."
            exit 0
          fi
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "Started packaged release ${TAG} for ${RELEASE_COMMIT}."

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Sync release-candidate artifacts on open release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RAW: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          # release-please-action v4 may emit either a bare PR number or a JSON
          # object with .number / .headBranchName.
          if [ -z "${PR_RAW}" ] || [ "${PR_RAW}" = "null" ]; then
            echo "No release-please PR; skipping candidate sync."
            exit 0
          fi
          if [[ "${PR_RAW}" =~ ^[0-9]+$ ]]; then
            PR_NUMBER="${PR_RAW}"
            BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
          else
            PR_NUMBER="$(printf '%s' "${PR_RAW}" | jq -r '.number // empty')"
            BRANCH="$(printf '%s' "${PR_RAW}" | jq -r '.headBranchName // empty')"
            if [ -z "${BRANCH}" ] && [ -n "${PR_NUMBER}" ]; then
              BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
            fi
          fi
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
            echo "Could not resolve release PR branch from: ${PR_RAW}"; exit 0
          fi
          GIT_NAME='Bridge-Node-7'
          GIT_MAIL_LOCAL='291729790+Bridge-Node-7'
          GIT_MAIL_DOMAIN='users.noreply.github.com'
          gh auth setup-git
          rm -rf .repo-sync
          git clone --branch "${BRANCH}" --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" .repo-sync
          cd .repo-sync
          node scripts/sync_release_candidate.mjs
          if git diff --quiet -- docs/RELEASE_NOTES.md site/manifest.sha256; then
            echo "Release-candidate artifacts already current on ${BRANCH}."
            exit 0
          fi
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" add docs/RELEASE_NOTES.md site/manifest.sha256
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" commit -m "chore: sync RELEASE_NOTES and site manifest for release candidate"
          git push origin "HEAD:${BRANCH}"
          echo "PASS synced release-candidate artifacts on ${BRANCH}"
