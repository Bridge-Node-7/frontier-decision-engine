name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # release-please's built-in GitHub Releases create lightweight tags, while
      # Pages / immutable-release require annotated tags. Keep release-please for
      # version PRs; publish the annotated tag + release here automatically when
      # a release-please merge lands (manifest bump on this commit).
      - name: Publish annotated tag and GitHub Release for released version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          TAG="v${VERSION}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          test "${VERSION}" = "${PACKAGE_VERSION}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to publish."
            exit 0
          fi

          if ! git diff --name-only "${RELEASE_COMMIT}^" "${RELEASE_COMMIT}" | grep -qx '.release-please-manifest.json'; then
            echo "Manifest unchanged on ${RELEASE_COMMIT}; not a release-please merge."
            exit 0
          fi

          TAG_OBJECT_SHA="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" \
            -f message="Frontier Decision Engine ${TAG}" \
            -f object="${RELEASE_COMMIT}" \
            -f type="commit" \
            --jq '.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_OBJECT_SHA}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')" = "tag"

          awk -v v="${VERSION}" '
            $0 ~ "^## \\[?" v "\\]?([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            notes_flags=(--notes-file release-notes.md)
          else
            notes_flags=(--generate-notes)
          fi
          gh release create "${TAG}" \
            --verify-tag \
            --latest \
            --title "Frontier Decision Engine ${TAG}" \
            "${notes_flags[@]}"
          echo "PASS annotated release ${TAG} at ${RELEASE_COMMIT}"

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Sync release-candidate artifacts on open release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER='${{ steps.release.outputs.pr }}'
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "No release-please PR number; skipping candidate sync."
            exit 0
          fi
          BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
            echo "Could not resolve headRefName for PR ${PR_NUMBER}; skipping."
            exit 0
          fi
          GIT_NAME='Bridge-Node-7'
          GIT_MAIL_LOCAL='291729790+Bridge-Node-7'
          GIT_MAIL_DOMAIN='users.noreply.github.com'
          gh auth setup-git
          rm -rf .repo-sync
          git clone --branch "${BRANCH}" --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" .repo-sync
          cd .repo-sync
          node scripts/sync_release_candidate.mjs
          if git diff --quiet -- docs/RELEASE_NOTES.md site/manifest.sha256; then
            echo "Release-candidate artifacts already current on ${BRANCH}."
            exit 0
          fi
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" add docs/RELEASE_NOTES.md site/manifest.sha256
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" commit -m "chore: sync RELEASE_NOTES and site manifest for release candidate"
          git push origin "HEAD:${BRANCH}"
          echo "PASS synced release-candidate artifacts on ${BRANCH}"
