<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The requested Frontier Decision Engine page was not found.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#050914">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <title>Page Not Found | Frontier Decision Engine</title>
  <style>
    :root{color-scheme:dark;--bg:#050914;--panel:#0a1428;--text:#f7f9ff;--muted:#c4cedd;--gold:#f1c86b;--gold2:#fff0b3;--line:rgba(255,255,255,.38)}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;min-width:320px;padding:1rem;background:radial-gradient(circle at 20% 10%,rgba(120,215,255,.15),transparent 28rem),radial-gradient(circle at 80% 15%,rgba(198,167,255,.13),transparent 30rem),linear-gradient(180deg,#050914,#071425 55%,#04070f);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
    main{width:min(760px,100%);padding:clamp(1.5rem,5vw,3rem);border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(180deg,var(--panel),rgba(255,255,255,.04));box-shadow:0 24px 80px rgba(0,0,0,.42)}
    .mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(255,240,179,.55);border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#07111f;font-weight:900}
    .eyebrow{margin-top:1.5rem;color:var(--gold2);font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:.4rem 0 .8rem;font-size:clamp(2.3rem,8vw,4.7rem);line-height:.98;letter-spacing:-.055em}
    p{max-width:58ch;margin:0;color:var(--muted)}
    nav{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}
    a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1rem;border:1px solid var(--line);border-radius:999px;color:var(--text);font-weight:800;text-decoration:none}
    a.primary{border:0;background-color:var(--gold);background-image:linear-gradient(135deg,var(--gold2),var(--gold));color:#07111f}
    a:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">7</div>
    <p class="eyebrow">Frontier Decision Engine</p>
    <h1>Page not found.</h1>
    <p>The requested path is unavailable. The working Decision Lab, application overview, and Bridge Node 7 remain available.</p>
    <nav aria-label="Recovery options">
      <a class="primary" href="/frontier-decision-engine/#/decision">Open Decision Lab</a>
      <a href="/frontier-decision-engine/">FDE Overview</a>
      <a href="/">Bridge Node 7 Home</a>

</body>
</html>
