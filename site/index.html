      <section class="panel stack"><span class="eyebrow">Frontier Decision Engine</span><h1>Bring the whole mess.</h1><p>Start with the situation in your own words. The interactive experience responds with a provisional decision surface, then lets a person confirm what belongs in the formal comparison.</p><p><strong>Six stages:</strong> frame the decision, define what matters, define choices, test plausible futures, compare outcomes, and record the human decision.</p><p><strong>Human authority:</strong> FDE does not approve, authorize, certify, qualify, consent, or make an investment decision. This public browser tool is not presented as an approved environment for confidential or controlled information.</p><p>Work stays in this browser unless downloaded or shared. Browser storage is a convenience, not encrypted confidential storage.</p></section>
